[project]
name = "fastapi-datallmreact"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6",
    "alembic>=1.18.5",
    "python-dotenv>=1.0",
    "structlog>=26.1.0",
    "pyjwt>=2.9",
    "resend>=2.4",
    "email-validator>=2.2",
    "uuid6>=2025.0.1",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "openai>=2.52.0",
    "sqlglot>=27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_email: hits the real Resend API instead of the stubbed EmailService",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends(...) default-argument pattern is idiomatic
    "UP042", # str+Enum vs StrEnum is an existing app choice, not a lint concern
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # autogenerated migrations, not hand-wrapped

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet"]
